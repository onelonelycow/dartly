<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Nabbly</title>
<meta name="description" content="That page isn't here. Head back to Nabbly and find your next freelance gig.">
<link rel="icon" type="image/png" href="/favicon.png">
<!-- A 404 should never be indexed, but it must not stop the crawler following
     the links out of it back into the real site. -->
<meta name="robots" content="noindex, follow">
<style>
  /* Tokens lifted from index.html so this page is unmistakably the same site. */
  :root{
    --bg:#121418; --bg2:#15181d; --panel:#171a20; --line:#262a31; --line2:#2f343d;
    --ink:#ECEEF1; --ink2:#c3c8d0; --mute:#969da7; --faint:#6b7280;
    --amber:#E8933A; --amber-l:#F7B569; --amber-d:#CB6F16;
    --maxw:1080px;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;width:100%}
  h1,h2{margin:0;font-weight:650;letter-spacing:-.02em;text-wrap:balance;line-height:1.1}
  .amber{color:var(--amber)}

  /* ── nav: same sticky, blurred bar as the landing page ── */
  header{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);
    background:rgba(18,20,24,.72);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:66px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:20px;
    letter-spacing:-.02em}
  .brand svg{display:block}
  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;
    border-radius:11px;padding:11px 18px;transition:.15s;cursor:pointer;
    border:1px solid transparent;white-space:nowrap}
  .btn-primary{background:linear-gradient(180deg,var(--amber-l),var(--amber-d));color:#2a1806;
    box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 18px rgba(203,111,22,.28)}
  .btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .btn-ghost{border-color:var(--line2);color:var(--ink);background:var(--bg2)}
  .btn-ghost:hover{border-color:var(--faint);background:var(--panel)}

  /* ── the empty dish: same restraint as the preview card and the weekly posts ── */
  main{flex:1;display:flex;align-items:center;padding:64px 0}
  .center{text-align:center}
  .dish{width:148px;height:148px;margin:0 auto 34px;position:relative;border-radius:50%;
    border:1px solid rgba(232,147,58,.16);
    background:radial-gradient(circle at 50% 50%,rgba(232,147,58,.085),transparent 66%)}
  .dish i{position:absolute;border-radius:50%;border:1px solid rgba(232,147,58,.13);
    display:block}
  .dish i:nth-child(1){inset:30px}
  .dish i:nth-child(2){inset:60px}
  /* one soft blip, warm rather than white — the single point of emphasis */
  .ping{position:absolute;top:50%;left:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;
    border-radius:50%;background:#FCE4C6;box-shadow:0 0 18px 6px rgba(232,147,58,.26)}

  h1{font-size:42px;margin-bottom:14px}
  p.lead{color:var(--ink2);margin:0 auto 32px;max-width:30em;font-size:17.5px}
  .cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:38px}
  .cta-row .btn{padding:14px 24px;font-size:16px}
  .more{border-top:1px solid var(--line);padding-top:22px;color:var(--faint);font-size:14px}
  .more a{color:var(--mute);margin:0 10px}
  .more a:hover{color:var(--amber)}

  footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--faint);
    font-size:13.5px}
  footer a{color:var(--mute)}
  footer a:hover{color:var(--ink)}

  @media (max-width:640px){
    h1{font-size:31px}
    main{padding:40px 0}
    .dish{width:118px;height:118px}
    .dish i:nth-child(1){inset:24px}
    .dish i:nth-child(2){inset:48px}
    .nav .btn{padding:9px 14px;font-size:14px}
  }
</style>
</head><body>

<header><div class="wrap nav">
  <a class="brand" href="/">

    <span>Nabb<span class="amber">ly</span></span>
  </a>
  <a class="btn btn-ghost" href="https://app.nabbly.co/">Open the board</a>
</div></header>

<main><div class="wrap center">
  <div class="dish"><i></i><i></i><span class="ping"></span></div>
  <h1>Nothing on the radar <span class="amber">here</span>.</h1>
  <p class="lead">That page doesn't exist, or it moved. The gigs are all still
     where you left them.</p>
  <div class="cta-row">
    <a class="btn btn-primary" href="https://app.nabbly.co/">Open the board</a>
    <a class="btn btn-ghost" href="/">Back to home</a>
  </div>
  <div class="more">
    <a href="/">Home</a>·<a href="https://app.nabbly.co/?nav=about">About</a>·<a href="https://app.nabbly.co/?nav=faq">FAQ</a>·<a href="/privacy.html">Privacy</a>·<a href="/terms.html">Terms</a>
  </div>
</div></main>

<footer><div class="wrap center">© 2026 Nabbly · <a href="/">nabbly.co</a></div></footer>

</body></html>
