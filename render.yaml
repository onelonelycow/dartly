# render.yaml — one-file "blueprint" so Render can build Nabbly automatically.
# In Render: New +  ->  Blueprint  ->  pick this repo, and it reads this file.
#
# Notes:
#  - Free plan: the app sleeps after ~15 min idle and takes ~30-60s to wake. Fine
#    for a preview; upgrade the plan later for an always-on "real" site.
#  - The build only installs deps (fast + reliable). The app ships with a bundled
#    seed.db so it has gigs on first load — no fragile live-fetch during the build.
#  - Visitors can pull the latest any time with the in-app "Check for new gigs"
#    button. For data + profile edits that SURVIVE redeploys, uncomment the disk
#    block and DATA_DIR.

services:
  # NAME MUST MATCH THE LIVE SERVICE. Render matches a blueprint to existing
  # services by name, so a name that doesn't match doesn't update anything —
  # it creates a second service. This said "gig-radar" long after the real app
  # was renamed "dartly", and "gig-radar" is the bare duplicate that cost an
  # hour in July and is now suspended. Syncing that would have pointed the
  # blueprint at the dud instead of the app holding every env var.
  - type: web
    name: dartly
    runtime: python
    # Upgraded 2026-08-01 (Standard, 2GB) after the app crashed on the free
    # tier's 512MB ceiling — it was booting at ~400MB before a single visitor,
    # and Market's altair import added another 51MB on first open. THIS LINE
    # MUST MATCH THE DASHBOARD or a future Blueprint sync silently drops the
    # live service back to free and reintroduces the exact crash this fixed.
    plan: standard
    # THREE ATTEMPTS, BECAUSE PYPI IS NOT A DEPENDENCY YOU CONTROL.
    # 2026-08-17 15:05:26 — this build lived 0.8 seconds:
    #   ERROR: HTTP error 502 while getting .../streamlit-1.61.1-...whl.metadata
    #   ERROR: 502 Server Error: Gateway Error
    # One file, one bad gateway from PyPI's CDN, no retry, build dead. It cost
    # three failed deploys and most of a day of chasing causes that were never
    # in this repo — the commits blamed by the failure emails had touched only
    # Jinja templates in web/, which a pip install never reads.
    #
    # `exit 0` on success and `exit 1` after the third attempt, deliberately:
    # a loop that ends on `sleep` would report a GREEN build with no
    # dependencies installed, which is far worse than the failure it replaces.
    # Both outcomes tested before shipping.
    buildCommand: "for i in 1 2 3; do pip install --no-cache-dir -r requirements.txt && exit 0; echo \"pip failed, retrying in 20s\"; sleep 20; done; exit 1"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      # DECLARED, NOT DEFINED. `sync: false` tells Render this service owns the
      # value in the dashboard and the blueprint must not touch it. Listing
      # them costs nothing and buys two things: a blueprint sync can never
      # decide an undeclared variable is surplus, and anyone reading this file
      # can see what the app actually needs to run instead of discovering it
      # from a stack trace.
      #
      # The app reads ~35 environment variables and this file used to name
      # ONE. These are the ones without which something visibly breaks.
      - key: DATABASE_URL          # the durable mirror; without it the board
        sync: false                # resets to the bundled seed on every deploy
      - key: RESEND_API_KEY        # all outbound mail, including sign-in codes
        sync: false
      - key: AUTH_COOKIE_SECRET    # sign-in survives a restart
        sync: false
      - key: ANTHROPIC_API_KEY     # Pro drafts fall back to the template
        sync: false
      - key: GOOGLE_CLIENT_ID      # sign in with Google
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY     # Pro checkout
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: OWNER_EMAIL           # where ops_watch sends outage alerts
        sync: false
      - key: NABBLY_BOARD_URL      # set to https://board.nabbly.co to move the
        sync: false                # Gigs tab to the fast board; clear to undo
      # PostHog, server-side and OFF until both of these are true: this key is
      # set here, and `posthog` is added to requirements.txt. See telemetry.py
      # for why there is no browser SDK (Streamlit strips script tags, and a
      # browser SDK would mean a consent banner on a site that sets no cookies
      # today). Leave POSTHOG_HOST unset for the EU region.
      - key: POSTHOG_API_KEY
        sync: false
      - key: POSTHOG_HOST
        sync: false
      # Optional: keep data + profile across redeploys (needs the disk below).
      # - key: DATA_DIR
      #   value: /var/data

    # Optional persistent storage (uncomment to keep the DB + profile between deploys).
    # A small disk is inexpensive; the free plan does not include one.
    # disk:
    #   name: dartly-data
    #   mountPath: /var/data
    #   sizeGB: 1

  # The public board, served as plain HTML instead of through Streamlit.
  #
  # Streamlit re-executes the whole app per visitor per click, holding every
  # gig in memory to render 25 cards: 25 concurrent readers took 10.67s and 50
  # failed outright. This serves the same board from one indexed query —
  # measured at 143ms for 100 concurrent and 245ms for 200, peaking at 123MB.
  #
  # STARTER, NOT STANDARD, ON PURPOSE. It peaked at 123MB against Starter's
  # 512MB. The app above needs Standard because it holds the whole board in
  # memory; this one never does, which is the entire point. Do not "match" the
  # app's plan — that is paying Standard prices for 123MB of usage.
  #
  # Answers on board.nabbly.co since 2026-08-14. Still blocked from search by
  # robots.txt and an X-Robots-Tag header until NABBLY_INDEXABLE=1, and the
  # app links to it only when NABBLY_BOARD_URL is set on the dartly service —
  # so the switch is a dashboard toggle, and so is the way back.
  - type: web
    name: nabbly-board
    runtime: python
    plan: starter
    buildCommand: "for i in 1 2 3; do pip install --no-cache-dir -r requirements.txt && exit 0; echo \"pip failed, retrying in 20s\"; sleep 20; done; exit 1"
    # One worker. Requests are ~1ms of Python over an indexed SQLite read, so
    # concurrency is bounded by I/O rather than CPU, and a second worker would
    # mean a second copy of the board file and a second sync loop pulling the
    # same rows. Scale by adding instances, not workers.
    startCommand: "uvicorn web.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Reaches the durable mirror to build and refresh its own local copy.
      # Same value as the app's; set it in the dashboard, not here.
      - key: DATABASE_URL
        sync: false
      # One sign-in covers app.nabbly.co and board.nabbly.co. Only correct
      # because the board now answers on a nabbly.co subdomain — a cookie
      # scoped to a domain the response did not come from is rejected outright
      # by the browser, so this must never be set while the service is only on
      # onrender.com.
      - key: NABBLY_COOKIE_DOMAIN
        value: ".nabbly.co"
      # "Continue with Google". Same credential as the app — set both in the
      # dashboard, identical values to dartly's.
      #
      # THE REDIRECT URI MUST BE REGISTERED BY HAND. Google refuses any
      # redirect_uri not listed on the credential, character for character, so
      # https://board.nabbly.co/auth/google/callback has to be added in the
      # Google Cloud console next to the app's existing /oauth2callback. No
      # code or config in this repo can do that step.
      #
      # Absent these, googleauth.enabled() is False and the sign-in page shows
      # the email form alone — no broken button.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # What the redirect_uri is built from. Fixed rather than derived from the
      # request, because behind Render's proxy the request's own scheme and
      # host are not reliably the public ones, and a redirect_uri differing by
      # so much as "http" fails the handshake.
      - key: NABBLY_PUBLIC_URL
        value: "https://board.nabbly.co"
      # Pro drafts. WITHOUT THIS THE BOARD SILENTLY SERVES THE FREE TEMPLATE TO
      # PAYING READERS. pitch.ai_available() is False when the key is unset, so
      # web/main.py takes the `else` branch and calls pitch.draft_template even
      # for a Pro account — same canned paragraph on every gig, no model call,
      # no error, nothing in the logs. The draft-voice settings (Length,
      # Include, Avoid, Signature) only ever reach pitch.SYSTEM on the model
      # path, so on the board they did nothing at all until this was declared.
      #
      # The app service declares this too and the two must hold the SAME value;
      # set it in the dashboard, not here. Undeclared is how it went missing:
      # the board was split out of the app and this one variable did not come
      # with it.
      - key: ANTHROPIC_API_KEY
        sync: false
    domains:
      - board.nabbly.co

  # The marketing front door: a plain static site served at nabbly.co.
  # Streamlit renders everything in JavaScript, so search engines and link
  # previews see almost nothing — this page is real HTML they can read, and it
  # loads instantly instead of waiting on the app's cold start. It links across
  # to the app (app.nabbly.co). Nothing to build; it's hand-written HTML.
  # Same naming rule as the app above: this is the live service's real name.
  - type: web
    name: nabbly-site-static
    runtime: static
    buildCommand: ""
    staticPublishPath: ./site
    headers:
      # Long-cache the images; keep the HTML fresh so edits show up fast.
      - path: /*.png
        name: Cache-Control
        value: "public, max-age=86400"
