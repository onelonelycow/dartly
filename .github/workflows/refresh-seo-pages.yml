# Rebuild the SEO pages from the live board, on a schedule.
#
# WHY THIS EXISTS: site/freelance-*-jobs/ carry sixteen real gig titles each,
# under a heading that says "Recently on the board". True the day they are
# generated, and quietly false a month later — describing work that closed
# weeks ago, to a reader who has no way of knowing. Nothing reminds anyone to
# re-run the generator, so on a long enough timeline nobody does.
#
# It also feeds Google something it wants: pages that never change get crawled
# less often. A weekly rebuild refreshes every lastmod in sitemap.xml with a
# real reason behind it rather than a bumped date.
#
# The generator reads the board from Supabase, not from demand_radar.db, which
# is gitignored and does not exist here. That is the whole reason read_board()
# prefers the durable mirror.
#
# Pushing to main triggers Render's own deploy of the static site, so this
# commit is the entire delivery mechanism. No deploy step needed here.
name: Refresh SEO pages

on:
  schedule:
    # 06:00 UTC on Mondays. Early enough that a week's worth of new gigs is in,
    # and a day when someone is around to notice if it breaks.
    - cron: "0 6 * * 1"
  workflow_dispatch:        # so it can be run by hand without waiting a week

permissions:
  contents: write           # needed to commit the regenerated pages

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only what the generator actually touches. Installing the app's full
      # requirements (streamlit, pandas, anthropic) would take minutes to build
      # a set of pages that needs a database driver and nothing else.
      - name: Install
        run: pip install --no-cache-dir "psycopg[binary]>=3.1,<4"

      - name: Rebuild pages from the live board
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python tools/make_field_pages.py

      # A run that produced nothing is a failure worth seeing, not a quiet
      # success: it means the mirror was unreachable and the fallback found no
      # local database either, so the pages would have been rewritten empty.
      - name: Check the pages are not empty
        run: |
          count=$(ls -d site/freelance-*-jobs 2>/dev/null | wc -l)
          echo "field pages: $count"
          if [ "$count" -lt 10 ]; then
            echo "::error::Only $count field pages generated. Refusing to commit."
            exit 1
          fi

      - name: Commit if anything changed
        run: |
          git config user.name  "nabbly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/
          if git diff --staged --quiet; then
            echo "board unchanged since last run, nothing to commit"
          else
            git commit -m "Refresh SEO pages from the live board

          Regenerated by .github/workflows/refresh-seo-pages.yml. The gig titles
          on these pages are shown under 'Recently on the board', so they have
          to actually be recent."
            git push
          fi
